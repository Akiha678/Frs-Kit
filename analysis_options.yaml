# 针对应用中 Dart 那一半的静态分析。
#
# 用 `flutter analyze` 运行它，或用 `just check` 一并覆盖 Rust 侧。
#
# lint 规则集是 `flutter_lints`（Flutter 团队的推荐）加上一组精心挑选的
# 更严格规则。新增的这些能抓住在混用异步 FFI 调用与 UI 代码的代码库里
# 出现的真实错误；而那些只调整空白字符的风格类规则被排除在外，
# 因为格式化工具已经决定了这些。

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - rust_builder/cargokit/**
    # 机器生成的：`rust/src/frb_generated.rs` 以及 `lib/src/rust/` 下的
    # Dart 文件由 `flutter_rust_bridge_codegen generate`（`just gen`）产出。
    # 对它们做 lint 只会产生没人能处理的噪音，因为下一次运行就会覆盖
    # 这些文件。它们仍会被编译，所以生成代码里真正的错误依然会让
    # `flutter test` 失败。
    - lib/src/rust/**
    - rust/target/**

    # 由 `flutter create` 生成的平台外壳；它们是与 Dart 相关的构建配置，
    # 而不是应用代码。
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**
    - build/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # --- 正确性 ------------------------------------------------------------
    # 在 bridge 应用里，未被 await 的 Future 通常意味着漏掉了对 Rust 调用的
    # `await`，随后它会静默失败。
    unawaited_futures: true
    # 能抓住把返回 Future 的表达式当作语句使用的情况，而上面那条规则看不到它。
    discarded_futures: true
    # 被比较而不是被检查的可空值。
    avoid_bool_literals_in_conditional_expressions: true
    # 在赋值前读取 `late` 字段就是一次运行时崩溃。
    unnecessary_late: true
    # 在 UI isolate 上做阻塞式文件 I/O。
    avoid_slow_async_io: true

    # --- API 设计 ----------------------------------------------------------
    # 一个库里凡是 `lib/src/` 之外的公开成员都值得配上文档注释；
    # 应用自身则允许写得简洁。
    always_declare_return_types: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    sort_constructors_first: true
    use_super_parameters: true
    avoid_redundant_argument_values: true
    omit_local_variable_types: false # 这里刻意使用显式类型
    unnecessary_lambdas: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_string_in_part_of_directives: true
    directives_ordering: true
    prefer_single_quotes: true

    # --- Flutter 相关 ------------------------------------------------------
    use_build_context_synchronously: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

# 延伸阅读：https://dart.dev/tools/analysis
