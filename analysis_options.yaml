# Static analysis for the Dart half of the app.
#
# Run it with `flutter analyze`, or `just check` to include the Rust side.
#
# The lint set is `flutter_lints` (the Flutter team's recommendations) plus a
# curated handful of stricter rules. The additions are the ones that catch real
# mistakes in a codebase that mixes async FFI calls with UI code; stylistic rules
# that only shuffle whitespace are left out, because the formatter already decides
# those.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - rust_builder/cargokit/**
    # Machine-written: `rust/src/frb_generated.rs` and the Dart files below
    # `lib/src/rust/` are produced by `flutter_rust_bridge_codegen generate`
    # (`just gen`). Linting them would only produce noise that no one can act on,
    # since the next run overwrites the files. They are still compiled, so a
    # genuine error in the generated code still fails `flutter test`.
    - lib/src/rust/**
    - rust/target/**

    # Platform shells generated by `flutter create`; they are Dart-adjacent build
    # configuration rather than app code.
    - android/**
    - ios/**
    - linux/**
    - macos/**
    - web/**
    - windows/**
    - build/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # --- correctness -------------------------------------------------------
    # An unawaited Future in a bridge app is usually a forgotten `await` on a
    # Rust call, which then fails silently.
    unawaited_futures: true
    # Catches a Future-returning expression used as a statement, which the rule
    # above cannot see.
    discarded_futures: true
    # Nullable values that are compared rather than checked.
    avoid_bool_literals_in_conditional_expressions: true
    # A `late` field read before assignment is a runtime crash.
    unnecessary_late: true
    # Blocking file I/O on the UI isolate.
    avoid_slow_async_io: true

    # --- API design --------------------------------------------------------
    # Every public member of a library that is not `lib/src/` benefits from a
    # doc comment; the app itself is allowed to be terse.
    always_declare_return_types: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    sort_constructors_first: true
    use_super_parameters: true
    avoid_redundant_argument_values: true
    omit_local_variable_types: false # explicit types are used deliberately here
    unnecessary_lambdas: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    require_trailing_commas: true
    sort_child_properties_last: true
    use_string_in_part_of_directives: true
    directives_ordering: true
    prefer_single_quotes: true

    # --- Flutter specifics -------------------------------------------------
    use_build_context_synchronously: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

# Further reading: https://dart.dev/tools/analysis
