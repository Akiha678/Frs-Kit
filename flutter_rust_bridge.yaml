# `flutter_rust_bridge_codegen` 的配置，这个工具把 `rust/src/api/**`
# 变成 `lib/src/rust/` 下的 Dart 文件。
#
# 重要的键即使与默认值相同也照样写明：脚手架应该记录自己的行为，
# 而不是依赖某个版本的默认值。
#
# 完整参考：https://cjycode.com/flutter_rust_bridge/manual/config

# 要扫描哪棵 Rust 模块树。从这里可达的每一个 `pub` 项都会成为
# Dart API 的一部分。
rust_input: crate::api

# 拥有 `rust_input` 的 crate，相对于本文件。它还决定了写进生成 Dart 里的
# 加载路径（`rust/target/release/`），也就是 `cargo build --release`
# 放置共享库的位置。
rust_root: rust/

# 生成的 Dart 放在哪里。这个目录是机器写的：绝不要手工编辑它，
# 也绝不要把代码手写进去。（`lib/src/rust/bridge.dart` 就放在它旁边，
# 正是出于这个原因。）
dart_output: lib/src/rust

# 生成的 Dart 入口类名，以 `RustLib.init()` 的形式使用。
dart_entrypoint_class_name: RustLib

# 生成的文件会被提交，所以升级 flutter_rust_bridge 应该是一次刻意的
# 提交，而不是运行生成器带来的副作用。
auto_upgrade_dependency: false
