name: frs_kit
description: "Flutter + Rust application scaffold, bridged with flutter_rust_bridge."
# Private application: never publish this to pub.dev.
publish_to: 'none'

# The native library is built separately (`just build`), so the Dart package
# version here only tracks the Flutter layer.
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The Dart half of the bridge: the dynamic-library loader, the support
  # libraries the generated code imports, and `AnyhowException`.
  #
  # Pinned exactly rather than `^2.13.0`. The generated glue asserts at startup
  # that the codegen version equals the runtime version, so a stray minor upgrade
  # would become a runtime failure. Move this pin, `flutter_rust_bridge` in
  # `rust/Cargo.toml`, and the `flutter_rust_bridge_codegen` binary together.
  flutter_rust_bridge: 2.13.0
  rust_lib_frs_kit:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drives the app on a real device, a desktop target or Chrome, so
  # `integration_test/` can exercise the Rust library end to end. The pure-Dart
  # `flutter test` cannot do that on its own.
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets and fonts go here. Nothing is declared yet, which keeps `pub get`
  # fast; remember that a missing entry fails at runtime, not at build time.
  # assets:
  #   - assets/images/
  # fonts:
  #   - family: Example
  #     fonts:
  #       - asset: assets/fonts/Example-Regular.ttf
