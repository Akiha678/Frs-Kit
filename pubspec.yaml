name: frs_kit
description: "Flutter + Rust application scaffold, bridged with flutter_rust_bridge."
# 私有应用：绝不要把它发布到 pub.dev。
publish_to: 'none'

# 原生库是单独构建的（`just build`），所以这里的 Dart 依赖包版本
# 只跟踪 Flutter 层。
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理、依赖注入，以及——等应用长出第二条路由之后——导航。
  # `Get.put`/`Get.find` 取代了脚手架过去携带的 InheritedNotifier 作用域，
  # 而 `Obx` 只重建那些读了某个 `Rx` 的 widget。
  get: ^4.7.3

  # bridge 的 Dart 那一半：动态库加载器、生成代码所 import 的支持库，
  # 以及 `AnyhowException`。
  #
  # 精确锁定版本，而不是用 `^2.13.0`。生成的胶水代码会在启动时断言 codegen
  # 版本等于运行时版本，所以一次随意的小版本升级就会变成运行时失败。
  # 请把这个锁定版本、`rust/Cargo.toml` 里的 `flutter_rust_bridge`，
  # 以及 `flutter_rust_bridge_codegen` 二进制一起调整。
  flutter_rust_bridge: 2.13.0
  rust_lib_frs_kit:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 在真机、桌面目标或 Chrome 上驱动应用，这样 `integration_test/`
  # 就能端到端地跑通 Rust 库。纯 Dart 的 `flutter test` 自己做不到
  # 这一点。
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 资源与字体写在这里。目前什么都没声明，这让 `pub get` 保持很快；
  # 记住：漏写条目会在运行时失败，而不是在构建时。
  # assets:
  #   - assets/images/
  # fonts:
  #   - family: Example
  #     fonts:
  #       - asset: assets/fonts/Example-Regular.ttf
